name: Keyveer
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Keyveer Local Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  KeyveerRuntime:
    type: framework
    platform: macOS
    sources:
      - path: Sources/KeyveerRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reinerlau.keyveer.runtime
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
  Keyveer:
    type: application
    platform: macOS
    sources:
      - path: Sources/KeyveerApp
    dependencies:
      - target: KeyveerRuntime
    resources:
      - path: Sources/KeyveerApp/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reinerlau.keyveer
        PRODUCT_NAME: Keyveer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: "-parse-as-library"
  KeyveerRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KeyveerRuntimeTests
    dependencies:
      - target: KeyveerRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reinerlau.keyveer.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Keyveer:
    build:
      targets:
        Keyveer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeyveerRuntimeTests
