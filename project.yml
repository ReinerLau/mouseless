name: Mouseless
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Mouseless Local Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  MouselessRuntime:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MouselessRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reinerlau.mouseless.runtime
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
  Mouseless:
    type: application
    platform: macOS
    sources:
      - path: Sources/MouselessApp
    dependencies:
      - target: MouselessRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reinerlau.mouseless
        PRODUCT_NAME: Mouseless
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: "-parse-as-library"
  MouselessRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MouselessRuntimeTests
    dependencies:
      - target: MouselessRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reinerlau.mouseless.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mouseless:
    build:
      targets:
        Mouseless: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MouselessRuntimeTests
